<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniAI - Unified Productivity Assistant</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="logo">OmniAI</div>
                <div class="user-profile">
                    <div class="user-avatar">JS</div>
                    <span>John Smith</span>
                </div>
            </div>
        </header>
        
        <div class="main-layout">
            <aside class="sidebar" id="sidebar"></aside>
            <main class="content-area">
                <div class="command-bar">
                    <input type="text" class="command-input" 
                           placeholder="What would you like me to do?">
                </div>
                <div id="dashboard" class="dashboard-section"></div>
            </main>
        </div>
    </div>

    <!-- Load all JavaScript files -->
    <script src="scripts/calendar.js"></script>
    <script src="scripts/tasks.js"></script>
    <script src="scripts/finance.js"></script>
    <script src="scripts/health.js"></script>
    <script src="scripts/news.js"></script>
    <script src="scripts/weather.js"></script>
    <script src="scripts/ai-assistant.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
